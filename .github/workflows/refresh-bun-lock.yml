name: Refresh Bun Lock Evidence

on:
  pull_request:
    paths:
      - 'expo/package.json'
      - 'expo/bun.lock'
      - '.github/workflows/refresh-bun-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Regenerate lockfile only
        run: bun install --lockfile-only
      - name: Commit regenerated lockfile when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo 'bun.lock is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          git commit -m 'chore: refresh Bun lockfile'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-bun-lock
          path: expo/bun.lock
          if-no-files-found: error
