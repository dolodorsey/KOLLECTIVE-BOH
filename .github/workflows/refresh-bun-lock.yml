name: Refresh Bun Lock Evidence

on:
  pull_request:
    paths:
      - 'expo/package.json'
      - 'expo/bun.lock'
      - '.github/workflows/refresh-bun-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Regenerate lockfile only
        run: bun install --lockfile-only
      - name: Show lockfile drift
        run: git diff -- bun.lock
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-bun-lock
          path: expo/bun.lock
          if-no-files-found: error
